<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <header>
        <div class="header-home">
            <div class="header-logo-group">
                <img src="../img/uleam-only-simon.webp" alt="Logo ULEAM" class="logo-header">
                <button id="boton-home-header">Home</button>
            </div>
            <span class="header-title">Sinev: Sistema integrado de nivelación educativa</span>
            <nav class="header-nav">
                <a href="#" class="nav-item">Inicio</a>
                <a href="#" class="nav-item">Ayuda</a>
                <a href="#" class="nav-item">Contacto</a>
            </nav>
        </div>
    </header>



    <main>
        <div class="division-body">
            <!-- Sección Izquierda: Inicio de Sesión -->
            <div class="seccion-izquierda">
                <div class="container-home-iniciosesion">
                    <h1 id="titulo-container-home">Sinev</h1>
                    <input type="text" placeholder="Usuario">
                    <input type="password" placeholder="Contraseña">
                    <a href="#" id="ancord-style-red">Olvidé mi contraseña</a>
                    <button type="submit">Iniciar Sesión</button>
                </div>
            </div>

            <!-- Sección Derecha: Imagen -->
            <div class="seccion-derecha">
                <img src="../img/fondo-uleam-fcvt.jpg" alt="Fondo representativo" class="imagen-fondo">
                <img src="../img/uleam-full-logo-box.webp" alt="Logo ULEAM" class="imagen-logo-flotante">
            </div>
        </div>
    </main>



    <footer>

    </footer>
</body>
</html>
